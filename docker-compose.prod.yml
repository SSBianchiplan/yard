# Produção: TLS no Traefik, identidade no Keycloak, campo em modo live.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d
#
# O que este arquivo assume e você precisa fornecer:
#   - DNS de `YARD_DOMAIN` apontando para o host;
#   - broker MQTT Sparkplug B e/ou endpoint OPC UA acessíveis da rede da planta;
#   - realm do Keycloak com os perfis yard.* criados (ver docs/OPERACAO.md).
#
# A API recusa subir se algo essencial ficar em configuração de desenvolvimento —
# é de propósito, e é melhor falhar no deploy do que descobrir na auditoria.

services:
  traefik:
    # v3.2 saiu de suporte (auditoria 2026-10): linha v3 corrente; fixe a versão/digest ao publicar.
    image: traefik:v3
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.tlschallenge=true
      - --accesslog=true
    ports: ['80:80', '443:443']
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-acme:/letsencrypt
    healthcheck:
      test: ['CMD', 'traefik', 'healthcheck', '--ping']
      interval: 20s
      timeout: 5s
      retries: 5

  db:
    image: timescale/timescaledb-ha:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - yard-db:/home/postgres/pgdata/data
      # Backup é responsabilidade de quem opera; o volume só existir não é backup.
      - ./ops/backup:/backup
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 10s
      timeout: 5s
      retries: 10
    # Banco não se expõe: só a rede interna alcança.
    expose: ['5432']

  keycloak:
    # >= 26.7.2: corrige GHSA-4gv3-mc9p-5wqc (tomada de conta pelo reset-credentials).
    image: quay.io/keycloak/keycloak:26.7.2
    restart: unless-stopped
    command: start --optimized --hostname https://auth.${YARD_DOMAIN}
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HOSTNAME_STRICT: 'true'
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: 'true'
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    depends_on:
      db: {condition: service_healthy}
    labels:
      - traefik.enable=true
      - traefik.http.routers.keycloak.rule=Host(`auth.${YARD_DOMAIN}`)
      - traefik.http.routers.keycloak.entrypoints=websecure
      - traefik.http.routers.keycloak.tls.certresolver=le
      - traefik.http.services.keycloak.loadbalancer.server.port=8080

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    # imagem roda como uid 10001; sem capacidades nem escalada de privilégio
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    environment:
      YARD_ENV: prod
      YARD_AUTH_MODE: oidc
      YARD_FIELD_MODE: live
      YARD_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      YARD_CORS_ORIGINS: https://${YARD_DOMAIN}
      YARD_OIDC_ISSUER: https://auth.${YARD_DOMAIN}/realms/yard
      YARD_OIDC_JWKS_URL: https://auth.${YARD_DOMAIN}/realms/yard/protocol/openid-connect/certs
      YARD_OIDC_AUDIENCE: yard-api
      YARD_PLANT_CODE: ${YARD_PLANT_CODE}
      YARD_PLANT_TIMEZONE: ${YARD_PLANT_TIMEZONE}
      YARD_MQTT_HOST: ${YARD_MQTT_HOST}
      YARD_MQTT_PORT: ${YARD_MQTT_PORT:-8883}
      YARD_MQTT_USERNAME: ${YARD_MQTT_USERNAME}
      YARD_MQTT_PASSWORD: ${YARD_MQTT_PASSWORD}
      YARD_MQTT_GROUP_ID: ${YARD_MQTT_GROUP_ID}
      YARD_OPCUA_ENDPOINT: ${YARD_OPCUA_ENDPOINT}
      YARD_OPCUA_USERNAME: ${YARD_OPCUA_USERNAME}
      YARD_OPCUA_PASSWORD: ${YARD_OPCUA_PASSWORD}
      YARD_LOG_JSON: 'true'
    depends_on:
      db: {condition: service_healthy}
    command: >
      sh -c "python -m alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4 --proxy-headers"
    healthcheck:
      test: ['CMD-SHELL', 'python -c "import urllib.request;urllib.request.urlopen(\"http://localhost:8000/ready\")"']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=Host(`${YARD_DOMAIN}`) && (PathPrefix(`/api`) || PathPrefix(`/ws`) || PathPrefix(`/sse`) || PathPrefix(`/portal`))
      - traefik.http.routers.api.entrypoints=websecure
      - traefik.http.routers.api.tls.certresolver=le
      - traefik.http.services.api.loadbalancer.server.port=8000
      # Portal do transportador é internet pública: rate limit separado.
      - traefik.http.middlewares.portal-ratelimit.ratelimit.average=20
      - traefik.http.middlewares.portal-ratelimit.ratelimit.burst=40

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_OIDC_ISSUER: https://auth.${YARD_DOMAIN}/realms/yard
        VITE_OIDC_CLIENT_ID: yard-web
    restart: unless-stopped
    depends_on:
      api: {condition: service_started}
    labels:
      - traefik.enable=true
      - traefik.http.routers.web.rule=Host(`${YARD_DOMAIN}`)
      - traefik.http.routers.web.entrypoints=websecure
      - traefik.http.routers.web.tls.certresolver=le
      - traefik.http.services.web.loadbalancer.server.port=8080
      - traefik.http.routers.web.middlewares=security-headers
      - traefik.http.middlewares.security-headers.headers.stsSeconds=31536000
      - traefik.http.middlewares.security-headers.headers.contentTypeNosniff=true
      - traefik.http.middlewares.security-headers.headers.browserXssFilter=true
      - traefik.http.middlewares.security-headers.headers.referrerPolicy=strict-origin-when-cross-origin

volumes:
  yard-db:
  traefik-acme:
