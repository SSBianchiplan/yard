[project]
name = "gplansis-yard-api"
version = "0.1.0"
description = "GPlanSiS|YARD - núcleo de pátio"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "python-multipart>=0.0.12",
    # PyJWT no lugar do python-jose (sem manutenção; puxava `ecdsa`, CVE-2024-23342)
    "PyJWT[crypto]>=2.10",
    "httpx>=0.27",
    # CAs emSign comprometidas removidas em 2026.10.19 (GHSA-6q48-6c7w-9gw2)
    "certifi>=2026.10.19",
    # campo (OT): opcionais até o modo live ser ligado
    "asyncio-mqtt>=0.16; extra == 'field'",
    "asyncua>=1.1; extra == 'field'",
]

[project.optional-dependencies]
field = ["asyncio-mqtt>=0.16", "asyncua>=1.1", "pyserial>=3.5"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

# `alembic/` fica ao lado de `app/` mas não é pacote distribuível: só `app` entra.
[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
