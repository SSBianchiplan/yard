server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # SPA: rota do React Router não é 404.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }

  # Assets com hash no nome podem ser cacheados para sempre.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # O app não carrega nada de fora: sem CDN, sem script de terceiro.
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; connect-src 'self' https: wss:; frame-ancestors 'none'; base-uri 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=()" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
