services:
  db:
    # TimescaleDB sobre PG16; pgvector vem na imagem -ha
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_USER: yard
      POSTGRES_PASSWORD: yard
      POSTGRES_DB: yard
    ports: ['5442:5432']
    volumes: ['yard-db:/home/postgres/pgdata/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U yard']
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./apps/api
    environment:
      YARD_DATABASE_URL: postgresql+asyncpg://yard:yard@db:5432/yard
      YARD_CORS_ORIGINS: http://localhost:5173
    depends_on:
      db: {condition: service_healthy}
    ports: ['8000:8000']
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes: ['./apps/api:/app']

  # Traefik e Keycloak entram junto com autenticação, na Fatia 2.

volumes:
  yard-db:
